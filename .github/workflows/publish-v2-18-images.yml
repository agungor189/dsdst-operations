name: Publish V2-18 immutable images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: v2-18-image-publication
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout source-set control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source-set-control
          persist-credentials: false
      - name: Create exact V2-18 build matrix
        id: plan
        working-directory: source-set-control
        run: |
          matrix=$(node scripts/release/image-publish.mjs plan config/v2-18-source-set.json)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout publication controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source-set-control
          persist-credentials: false
      - name: Checkout exact component source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.source_repository }}
          ref: ${{ matrix.revision }}
          path: source
          persist-credentials: false
          token: ${{ secrets.DSDST_SOURCE_READ_TOKEN || github.token }}
      - name: Verify exact checkout identity
        env:
          IMAGE_BUILD_PLAN_ENTRY: ${{ toJSON(matrix) }}
        run: node source-set-control/scripts/release/image-publish.mjs verify-checkout source
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push exact image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: true
          provenance: mode=max
          sbom: false
          tags: ${{ matrix.image_repository }}:v2-18-${{ matrix.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ matrix.source_repository }}
            org.opencontainers.image.revision=${{ matrix.revision }}
      - name: Verify registry digest and OCI labels
        env:
          IMAGE_BUILD_PLAN_ENTRY: ${{ toJSON(matrix) }}
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
          IMMUTABLE_REFERENCE: ${{ matrix.image_repository }}@${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMMUTABLE_REFERENCE" --format '{{json .Image}}' > published-image.json
          mkdir -p image-record
          node source-set-control/scripts/release/image-publish.mjs record \
            "$PUBLISHED_DIGEST" published-image.json "image-record/${{ matrix.id }}.json"
          printf '%s: %s\n' '${{ matrix.id }}' "$IMMUTABLE_REFERENCE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload verified image record
        uses: actions/upload-artifact@v4
        with:
          name: v2-18-image-${{ matrix.id }}
          path: image-record/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 30

  manifest:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source-set-control
          persist-credentials: false
      - name: Download verified image records
        uses: actions/download-artifact@v4
        with:
          pattern: v2-18-image-*
          path: published-images
          merge-multiple: true
      - name: Assemble redacted immutable image manifest
        run: |
          mkdir -p artifact
          node source-set-control/scripts/release/image-publish.mjs assemble \
            source-set-control/config/v2-18-source-set.json \
            published-images \
            artifact/v2-18-image-manifest.json
          jq -r '.images[] | "\(.service): \(.image_reference)"' \
            artifact/v2-18-image-manifest.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted immutable image manifest
        uses: actions/upload-artifact@v4
        with:
          name: v2-18-image-manifest
          path: artifact/v2-18-image-manifest.json
          if-no-files-found: error
          retention-days: 90
