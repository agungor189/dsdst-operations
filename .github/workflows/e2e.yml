name: Operations E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source-set control
        uses: actions/checkout@v4
        with:
          path: source-set-control
      - name: Checkout exact Operations source
        uses: actions/checkout@v4
        with:
          repository: agungor189/dsdst-operations
          ref: 6c944b9bcbc5d9cad087b66683b5aa9a736ba0b3
          path: dsdst-operations
      - uses: actions/checkout@v4
        with:
          repository: agungor189/panel-kit-yonetimi
          ref: fa58bf8e703b33a758bd5e81a274f06275490f09
          path: panel-kit-yonetimi
      - uses: actions/checkout@v4
        with:
          repository: agungor189/Dsdst-Warehouse
          ref: 6a3819629b66b83b0ee6aecacdd3cae606951a16
          path: Dsdst-Warehouse
      - uses: actions/checkout@v4
        with:
          repository: agungor189/dsdst-kit-studio
          ref: c76904d38921a39d8d791b5ef1ec0c232df9bd45
          path: dsdst-kit-studio
      - uses: actions/checkout@v4
        with:
          repository: agungor189/Label-Printer
          ref: 12219ae925690238c7f6f1bb073d7c9ccd97a88f
          path: Label-Printer
      - uses: actions/checkout@v4
        with:
          repository: agungor189/dsdst-customer-hub
          ref: f030c29b6ee41765289993fda1e94d1e484b5cac
          path: dsdst-customer-hub
      - name: Verify exact source set
        working-directory: source-set-control
        env:
          OPERATIONS_CONTEXT: ../dsdst-operations
          PANEL_CONTEXT: ../panel-kit-yonetimi
          WAREHOUSE_CONTEXT: ../Dsdst-Warehouse
          KIT_STUDIO_CONTEXT: ../dsdst-kit-studio
          LABEL_PRINTER_CONTEXT: ../Label-Printer
          CUSTOMER_HUB_CONTEXT: ../dsdst-customer-hub
        run: node scripts/verify-source-set.mjs
      - name: Run isolated system workflow
        working-directory: dsdst-operations
        env:
          SOURCE_SET_MANIFEST: ../source-set-control/config/v2-02-source-set.json
        run: ./scripts/e2e.sh
