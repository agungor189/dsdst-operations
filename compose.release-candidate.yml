services:
  dsdst-panel:
    build: !reset null
    image: ${PANEL_IMAGE:?PANEL_IMAGE immutable digest is required}
    ports: !override
      - "127.0.0.1:${CANDIDATE_PANEL_PORT:?CANDIDATE_PANEL_PORT is required}:3000"
    volumes:
      - candidate_panel_data:/data
      - candidate_panel_uploads:/app/uploads
      - candidate_panel_backups:/backups

  dsdst-warehouse:
    build: !reset null
    image: ${WAREHOUSE_IMAGE:?WAREHOUSE_IMAGE immutable digest is required}
    ports: !override
      - "127.0.0.1:${CANDIDATE_WAREHOUSE_PORT:?CANDIDATE_WAREHOUSE_PORT is required}:3006"

  dsdst-kit-studio:
    build: !reset null
    image: ${KIT_STUDIO_IMAGE:?KIT_STUDIO_IMAGE immutable digest is required}
    ports: !override
      - "127.0.0.1:${CANDIDATE_KIT_STUDIO_PORT:?CANDIDATE_KIT_STUDIO_PORT is required}:3012"
    volumes:
      - candidate_kit_data:/data
      - candidate_kit_uploads:/app/uploads

  dsdst-customer-hub:
    build: !reset null
    image: ${CUSTOMER_HUB_IMAGE:?CUSTOMER_HUB_IMAGE immutable digest is required}
    ports: !override
      - "127.0.0.1:${CANDIDATE_CUSTOMER_HUB_PORT:?CANDIDATE_CUSTOMER_HUB_PORT is required}:3100"
    volumes:
      - candidate_customer_hub_data:/data
      - candidate_customer_hub_backups:/backups

  label-printer:
    build: !reset null
    image: ${LABEL_PRINTER_IMAGE:?LABEL_PRINTER_IMAGE immutable digest is required}
    ports: !override
      - "127.0.0.1:${CANDIDATE_LABEL_PRINTER_PORT:?CANDIDATE_LABEL_PRINTER_PORT is required}:3000"
    volumes:
      - candidate_label_data:/app/data

  warehouse-label-renderer:
    build: !reset null
    image: ${LABEL_PRINTER_IMAGE:?LABEL_PRINTER_IMAGE immutable digest is required}
    volumes:
      - candidate_label_data:/app/data:ro

  operations-toolbox:
    build: !reset null
    image: ${OPERATIONS_TOOLBOX_IMAGE:?OPERATIONS_TOOLBOX_IMAGE immutable digest is required}
    volumes:
      - candidate_panel_data:/sources/panel-data:ro
      - candidate_panel_uploads:/sources/panel-uploads:ro
      - candidate_kit_data:/sources/kit-data:ro
      - candidate_kit_uploads:/sources/kit-uploads:ro
      - candidate_label_data:/sources/labels:ro
      - candidate_customer_hub_data:/sources/customer-hub-data:ro
      - candidate_release_backups:/backups
      - ./scripts:/operations/scripts:ro

volumes:
  candidate_panel_data:
    name: ${RELEASE_CANDIDATE_PROJECT:?RELEASE_CANDIDATE_PROJECT is required}-panel-data
  candidate_panel_uploads:
    name: ${RELEASE_CANDIDATE_PROJECT:?RELEASE_CANDIDATE_PROJECT is required}-panel-uploads
  candidate_panel_backups:
    name: ${RELEASE_CANDIDATE_PROJECT:?RELEASE_CANDIDATE_PROJECT is required}-panel-backups
  candidate_kit_data:
    name: ${RELEASE_CANDIDATE_PROJECT:?RELEASE_CANDIDATE_PROJECT is required}-kit-data
  candidate_kit_uploads:
    name: ${RELEASE_CANDIDATE_PROJECT:?RELEASE_CANDIDATE_PROJECT is required}-kit-uploads
  candidate_label_data:
    name: ${RELEASE_CANDIDATE_PROJECT:?RELEASE_CANDIDATE_PROJECT is required}-label-data
  candidate_customer_hub_data:
    name: ${RELEASE_CANDIDATE_PROJECT:?RELEASE_CANDIDATE_PROJECT is required}-customer-hub-data
  candidate_customer_hub_backups:
    name: ${RELEASE_CANDIDATE_PROJECT:?RELEASE_CANDIDATE_PROJECT is required}-customer-hub-backups
  candidate_release_backups:
    name: ${RELEASE_CANDIDATE_PROJECT:?RELEASE_CANDIDATE_PROJECT is required}-release-backups

networks:
  edge:
    name: ${RELEASE_CANDIDATE_PROJECT:?RELEASE_CANDIDATE_PROJECT is required}-edge
  internal:
    name: ${RELEASE_CANDIDATE_PROJECT:?RELEASE_CANDIDATE_PROJECT is required}-internal
    internal: true
